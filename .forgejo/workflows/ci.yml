name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The self-hosted runner exposes the `native:host` label and executes steps
    # directly on the host, so the workflow uses the host toolchain instead of
    # container-only GitHub actions.
    runs-on: native:host
    steps:
      - name: Toolchain
        run: |
          go version
          golangci-lint --version

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Nix build (compiles and runs the suite in the sandbox)
        run: nix build . --print-build-logs

      - name: Self-scan
        run: go run ./cmd/binary-checker .
