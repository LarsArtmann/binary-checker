name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: native
    steps:
      - name: Diagnose runner environment
        continue-on-error: true
        run: |
          echo "pwd=$(pwd)"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-<unset>}"
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-<unset>}"
          echo "GITHUB_SERVER_URL=${GITHUB_SERVER_URL:-<unset>}"
          echo "GITHUB_SHA=${GITHUB_SHA:-<unset>}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME:-<unset>}"
          echo "HOME=${HOME:-<unset>}"
          ls -la "${GITHUB_WORKSPACE:-.}" | head -20
          env | grep -E "^GITHUB|^GITEA" | sort
