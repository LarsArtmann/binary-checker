name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The self-hosted runner exposes the `native` label (host backend). In that
    # mode the workspace starts EMPTY: there is no checkout step and no PATH
    # entry for the linters, so the first step fetches the exact commit and
    # every later step changes into it.
    runs-on: native
    steps:
      - name: Checkout
        run: |
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset by the runner}"
          git init -q .
          git remote add origin "http://${GITHUB_TOKEN}@${GITHUB_SERVER_URL#http://}/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 --quiet origin "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Build and vet
        run: |
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset by the runner}"
          go build ./...
          go vet ./...

      - name: Test
        run: |
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset by the runner}"
          go test -race -count=1 ./...

      - name: Lint
        run: |
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset by the runner}"
          lint="$(command -v golangci-lint || echo /run/current-system/sw/bin/golangci-lint)"
          "$lint" run ./...

      - name: Nix build (compiles and runs the suite in the sandbox)
        run: |
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset by the runner}"
          nix_bin="$(command -v nix || echo /run/current-system/sw/bin/nix)"
          "$nix_bin" build . --print-build-logs

      - name: Self-scan
        run: |
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset by the runner}"
          go run ./cmd/binary-checker .
