name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The self-hosted runner exposes the `native` label (host backend) and runs
    # steps directly on the host. Its PATH carries Go but not every tool, so
    # each step resolves its binary with an explicit fallback.
    runs-on: native
    steps:
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Lint
        run: |
          lint="$(command -v golangci-lint || echo /run/current-system/sw/bin/golangci-lint)"
          "$lint" run ./...

      - name: Nix build (compiles and runs the suite in the sandbox)
        run: |
          nix_bin="$(command -v nix || echo /run/current-system/sw/bin/nix)"
          "$nix_bin" build . --print-build-logs

      - name: Self-scan
        run: go run ./cmd/binary-checker .
